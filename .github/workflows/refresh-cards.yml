name: Refresh profile cards

# Redraws the cards with fresh GitHub numbers every morning (07:00 IST),
# whenever the words or the drawing code change, and on demand.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - assets/**
      - fonts/**
      - .github/workflows/refresh-cards.yml

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions and repo stats
        run: python scripts/fetch_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the cards and README
        run: python scripts/render_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards data
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Refresh profile cards"
            git push
          fi
